        <div class="explanation">
            <h2>莫慢待的意思</h2>
            <p>"莫慢待" 是一个中文短语，意思是<strong>"没问题"</strong>或<strong>"不用客气"</strong>。</p>

            <div class="translation">
                <h3>详细解释：</h3>
                <ul style="text-align: left; display: inline-block;">
                    <li><strong>莫 (mò)</strong>：不要、不用</li>
                    <li><strong>慢待 (màn dài)</strong>：怠慢、冷落</li>
                    <li><strong>整体意思</strong>：不用客气、没关系、没问题</li>
                </ul>
                <p>这是一个礼貌的表达方式，常用于回应别人的感谢或道歉，表示不用放在心上。</p>
            </div>
